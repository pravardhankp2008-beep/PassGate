<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PassGate — Check-in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='16' rx='2'/><path d='M7 8h10'/><path d='M7 12h10'/><path d='M7 16h6'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="./supabaseClient.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --surface: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --primary: #6366f1;
      --success: #16a34a;
      --danger: #dc2626;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    .pinned-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 16px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: var(--primary);
      color: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-counter {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }

    .header-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color .15s;
    }

    .header-links a:hover {
      color: var(--text);
    }

    .scanner-main {
      flex: 1;
      padding: 32px 0 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scanner-card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .viewfinder-wrapper {
      position: relative;
      width: 100%;
      min-height: 320px;
      background: #020617;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #reader {
      width: 100% !important;
      border: none !important;
    }

    #reader video {
      border-radius: 8px;
      object-fit: cover;
      width: 100% !important;
    }

    .reticle-box {
      position: absolute;
      width: 200px;
      height: 200px;
      pointer-events: none;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      z-index: 2;
    }

    .scan-status-strip {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }

    .manual-entry {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .manual-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .manual-form {
      display: flex;
      gap: 8px;
    }

    .manual-input {
      flex: 1;
      height: 44px;
      padding: 0 14px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .manual-input:focus {
      border-color: var(--primary);
    }

    .btn-verify {
      height: 44px;
      background: var(--primary);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity .15s;
    }

    .btn-verify:hover {
      opacity: 0.9;
    }

    .feedback-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .feedback-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .feedback-overlay.success {
      background: #15803d;
      color: #ffffff;
    }

    .feedback-overlay.danger {
      background: #b91c1c;
      color: #ffffff;
    }

    .feedback-icon {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .feedback-name {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .feedback-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.25);
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .feedback-msg {
      font-size: 16px;
      opacity: 0.95;
      max-width: 400px;
      line-height: 1.5;
    }

    .feedback-dismiss-hint {
      margin-top: 32px;
      font-size: 13px;
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <header class="pinned-header">
    <div class="container header-inner">
      <a href="./index.html" class="brand">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M7 8h10"/>
            <path d="M7 12h10"/>
            <path d="M7 16h6"/>
          </svg>
        </div>
        PassGate Scanner
      </a>

      <div class="mini-counter">
        <div class="live-dot"></div>
        <span id="miniCounterText">Live Turnout: Syncing...</span>
      </div>

      <div class="header-links">
        <a href="./admin.html">Dashboard</a>
      </div>
    </div>
  </header>

  <main class="scanner-main">
    <div class="container" style="display: flex; justify-content: center;">
      <div class="scanner-card">
        <div class="viewfinder-wrapper">
          <div id="reader"></div>
          <div class="reticle-box"></div>
        </div>

        <div class="scan-status-strip">
          <span id="scannerStatusText">Camera standby... Align ticket QR</span>
          <span style="font-family: monospace;">Supabase Active</span>
        </div>

        <div class="manual-entry">
          <label class="manual-label" for="manualToken">Manual Ticket ID Entry</label>
          <form class="manual-form" id="manualForm">
            <input type="text" id="manualToken" class="manual-input" placeholder="Paste or type Pass ID..." required>
            <button type="submit" class="btn-verify">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Verify
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div class="feedback-overlay" id="feedbackOverlay" onclick="dismissOverlay()">
    <div class="feedback-icon" id="feedbackIcon"></div>
    <div class="feedback-name" id="feedbackName">Attendee Name</div>
    <span class="feedback-badge" id="feedbackBadge">General</span>
    <div class="feedback-msg" id="feedbackMsg">Validation message</div>
    <div class="feedback-dismiss-hint">Tap anywhere to scan next</div>
  </div>

  <script>
    let isProcessing = false;
    let html5QrCode = null;
    let currentEvent = null;

    async function refreshTurnoutCounter() {
      try {
        const events = await window.PassGate.getEvents();
        if (events && events.length > 0) {
          currentEvent = events.find(e => e.is_active) || events[0];
          const reg = currentEvent.attendee_count || 0;
          const chk = currentEvent.checked_in_count || 0;
          const rem = Math.max(0, currentEvent.capacity - reg);
          document.getElementById('miniCounterText').textContent =
            `Registered ${reg} · Checked In ${chk} · Remaining ${rem}`;
        }
      } catch (err) {}
    }

    refreshTurnoutCounter();
    setInterval(refreshTurnoutCounter, 2500);

    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          handleScan(decodedText);
        },
        (errorMessage) => {}
      ).catch(err => {
        document.getElementById('scannerStatusText').textContent = 'Camera unavailable. Please use manual entry below.';
      });
    }

    async function handleScan(payload) {
      if (isProcessing) return;
      isProcessing = true;

      document.getElementById('scannerStatusText').textContent = 'Processing validation...';

      try {
        const result = await window.PassGate.validateCheckIn(payload);

        if (result.success) {
          triggerSuccessState(result.attendee);
        } else if (result.reason === 'already_used') {
          triggerDuplicateState(result.attendee, result.message);
        } else {
          triggerInvalidState(result.message || 'Pass not recognized in registry');
        }
      } catch (err) {
        triggerInvalidState('Network interruption occurred during check-in');
      } finally {
        refreshTurnoutCounter();
      }
    }

    function triggerSuccessState(attendee) {
      window.PassGate.playTone('success');
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

      const overlay = document.getElementById('feedbackOverlay');
      overlay.className = 'feedback-overlay success active';

      document.getElementById('feedbackIcon').innerHTML = `
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      `;
      document.getElementById('feedbackName').textContent = attendee.full_name || 'Verified Attendee';
      document.getElementById('feedbackBadge').textContent = attendee.ticket_type || 'General Pass';
      document.getElementById('feedbackBadge').style.display = 'inline-block';
      document.getElementById('feedbackMsg').textContent = 'Valid ticket. Entry approved.';

      autoDismissTimer = setTimeout(dismissOverlay, 3500);
    }

    function triggerDuplicateState(attendee, message) {
      window.PassGate.playTone('danger');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

      const overlay = document.getElementById('feedbackOverlay');
      overlay.className = 'feedback-overlay danger active';

      document.getElementById('feedbackIcon').innerHTML = `
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      `;
      document.getElementById('feedbackName').textContent = attendee ? attendee.full_name : 'Duplicate Scan';
      document.getElementById('feedbackBadge').textContent = 'Access Denied';
      document.getElementById('feedbackBadge').style.display = 'inline-block';
      document.getElementById('feedbackMsg').textContent = message || 'Ticket was already scanned earlier.';

      autoDismissTimer = setTimeout(dismissOverlay, 3500);
    }

    function triggerInvalidState(message) {
      window.PassGate.playTone('danger');
      if (navigator.vibrate) navigator.vibrate([300]);

      const overlay = document.getElementById('feedbackOverlay');
      overlay.className = 'feedback-overlay danger active';

      document.getElementById('feedbackIcon').innerHTML = `
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      `;
      document.getElementById('feedbackName').textContent = 'Invalid Ticket';
      document.getElementById('feedbackBadge').style.display = 'none';
      document.getElementById('feedbackMsg').textContent = message;

      autoDismissTimer = setTimeout(dismissOverlay, 3500);
    }

    let autoDismissTimer = null;
    function dismissOverlay() {
      clearTimeout(autoDismissTimer);
      const overlay = document.getElementById('feedbackOverlay');
      overlay.classList.remove('active');
      document.getElementById('scannerStatusText').textContent = 'Camera ready. Waiting for pass...';
      setTimeout(() => {
        isProcessing = false;
      }, 500);
    }

    document.getElementById('manualForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('manualToken').value.trim();
      if (val) {
        handleScan(val);
        document.getElementById('manualToken').value = '';
      }
    });

    window.addEventListener('load', () => {
      startCamera();
    });
  </script>
</body>
</html>
